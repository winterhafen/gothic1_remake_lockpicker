<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic 1 Remake - Lock Solver</title>
    <style>
       
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2a2a2a;
            --accent-color: #d4af37; /* Gothic-Gold */
            --text-color: #ffffff;
            --active-color: #4a3728;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h3 {
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .container {
            background-color: var(--panel-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 100%;
        }

        .setup-row {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        input[type="number"] {
            background: #333;
            border: 1px solid var(--accent-color);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            width: 60px;
            font-size: 16px;
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #fff;
        }

        .disk-row {
            display: flex;
            align-items: center;
            background: #222;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #444;
            transition: all 0.3s;
        }

        .disk-row.edit-master {
            border-color: #00ff00;
            background-color: #1b2e1b;
        }

        .disk-row.edit-slave {
            border-color: #33a6cc;
            background-color: #17252a;
        }

        .disk-label {
            width: 90px;
            font-weight: bold;
        }

        /* Circle representation of disks */
        .circle-container {
            display: flex;
            gap: 8px;
            background: #111;
            padding: 8px;
            border-radius: 20px;
            margin-right: 15px;
        }

        .circle {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
            background: #333;
        }

        .circle.active {
            background-color: var(--accent-color);
            color: black;
            border-color: #fff;
            box-shadow: 0 0 8px var(--accent-color);
        }

        .circle.target {
            border-color: #00ff00;
        }

        /* Edit Mode Controls */
        .edit-btn {
            background: #444;
            color: white;
            margin-left: auto;
        }
        
        .edit-btn.active {
            background: #00ff00;
            color: black;
        }

        .dep-controls {
            display: none;
            gap: 5px;
            margin-left: 15px;
        }

        .dep-btn {
            width: 35px;
            height: 30px;
            padding: 0;
            background: #444;
            color: white;
        }

        .dep-btn.selected {
            background: #33a6cc;
            color: white;
            font-weight: bold;
        }

        .lang-switch {
            display: flex;
            gap: 5px;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .lang-btn {
            background: #444;
            color: white;
            padding: 5px 10px;
            font-size: 14px;
            border-radius: 4px;
        }

        .lang-btn.active {
            background-color: var(--accent-color);
            color: black;
        }

        #output {
            margin-top: 20px;
            background: #111;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-color);
            white-space: pre-line;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="lang-switch">
    <button id="lang-btn-de" class="lang-btn active" onclick="changeLanguage('de')">DE</button>
    <button id="lang-btn-en" class="lang-btn" onclick="changeLanguage('en')">EN</button>
</div>


<div class="container">
    <h1>Gothic 1 Remake - Schloss-Knacker</h1>
    
    <div class="setup-row">
        <label for="diskCount">Anzahl Scheiben:</label>
        <input type="number" id="diskCount" value="4" min="1" max="10">
        <button onclick="initLock()">Schloss generieren</button>
    </div>

    <div id="lockContainer"></div>

    <div style="margin-top: 25px;">
        <button id="solveBtn" style="font-size: 18px; width: 100%; padding: 12px;" onclick="calculateRoute()">Lösung berechnen</button>
    </div>

    <h3>Lösungsweg:</h3>
    <div id="output">Klicke auf "Lösung berechnen", um die Kombination zu sehen...</div>
</div>

<script>
    // Global states
    let currentLang = 'en';
    let disks = []; 
    let dependencies = {}; 
    let currentMasterIdx = null; 

    // Dictionary for translations
    const translations = {
        de: {
            title: "Gothic 1 Remake - Schloss-Knacker",
            diskCountLabel: "Anzahl Scheiben:",
            generateBtn: "Schloss generieren",
            solveBtn: "Lösung berechnen",
            solutionTitle: "Lösungsweg:",
            defaultOutput: 'Klicke auf "Lösung berechnen", um die Kombination zu sehen...',
            diskLabel: "Scheibe",
            editBtnDefault: "Abhängigkeit einstellen",
            editBtnActive: "Fertig",
            alertEditMode: "Bitte beende zuerst den Bearbeitungsmodus der Abhängigkeiten ('Fertig' klicken).",
            alreadyOpen: "Das Schloss ist bereits offen! Alle Scheiben stehen auf 4.",
            successTitle: "✨ ERFOLG! Nutze folgende Kombination:\n\n",
            stepText: "Schritt ",
            moveText: "Bewege Scheibe",
            toText: "nach",
            noSolution: "❌ Keine Lösung gefunden! Überprüfe deine Werte oder die Abhängigkeiten.",
            left: "LINKS",
            right: "RECHTS"
        },
        en: {
            title: "Gothic 1 Remake - Lock Picker",
            diskCountLabel: "Number of Disks:",
            generateBtn: "Generate Lock",
            solveBtn: "Calculate Solution",
            solutionTitle: "Solution Path:",
            defaultOutput: 'Click "Calculate Solution" to see the combination...',
            diskLabel: "Disk",
            editBtnDefault: "Set Dependency",
            editBtnActive: "Done",
            alertEditMode: "Please finish the dependency editing mode first (click 'Done').",
            alreadyOpen: "The lock is already open! All disks are set to 4.",
            successTitle: "✨ SUCCESS! Use the following combination:\n\n",
            stepText: "Step ",
            moveText: "Move Disk",
            toText: "to",
            noSolution: "❌ No solution found! Check your values or dependencies.",
            left: "LEFT",
            right: "RIGHT"
        }
    };

    function changeLanguage(lang) {
        currentLang = lang;
        
        // Toggle button appearance
        document.getElementById('lang-btn-de').classList.toggle('active', lang === 'de');
        document.getElementById('lang-btn-en').classList.toggle('active', lang === 'en');

        // Translate static texts
        document.querySelector('h1').innerText = translations[lang].title;
        document.querySelector('label[for="diskCount"]').innerText = translations[lang].diskCountLabel;
        document.querySelector('button[onclick="initLock()"]').innerText = translations[lang].generateBtn;
        document.getElementById('solveBtn').innerText = translations[lang].solveBtn;
        document.querySelector('h3').innerText = translations[lang].solutionTitle;

        // If no active solution path, translate default text
        const outputDiv = document.getElementById('output');
        if (outputDiv.innerText.includes('Klicke') || outputDiv.innerText.includes('Click')) {
            outputDiv.innerText = translations[lang].defaultOutput;
        }

        // Adjust dynamic labels of disks
        const count = disks.length;
        for (let i = 0; i < count; i++) {
            const row = document.getElementById(`disk-row-${i}`);
            if (row) {
                const label = row.querySelector('.disk-label');
                label.innerText = `${translations[lang].diskLabel} S${i + 1}`;
                
                const editBtn = document.getElementById(`edit-btn-${i}`);
                if (currentMasterIdx === i) {
                    editBtn.innerText = translations[lang].editBtnActive;
                } else {
                    editBtn.innerText = translations[lang].editBtnDefault;
                }
            }
        }
    }

    function initLock() {
        const count = parseInt(document.getElementById('diskCount').value);
        const container = document.getElementById('lockContainer');
        container.innerHTML = '';
        
        disks = Array(count).fill(1); 
        dependencies = {};
        currentMasterIdx = null;

        for (let i = 0; i < count; i++) {
            dependencies[i] = {};
            for (let j = 0; j < count; j++) {
                dependencies[i][j] = 0; 
            }
        }

        // Build DOM elements (Reverse: Last disk on top, S1 at the bottom)
        for (let i = count - 1; i >= 0; i--) {
            const row = document.createElement('div');
            row.className = 'disk-row';
            row.id = `disk-row-${i}`;

            const label = document.createElement('div');
            label.className = 'disk-label';
            label.innerText = `${translations[currentLang].diskLabel} S${i + 1}`;
            row.appendChild(label);

            const circleContainer = document.createElement('div');
            circleContainer.className = 'circle-container';
            for (let pos = 1; pos <= 7; pos++) {
                const circle = document.createElement('div');
                circle.className = `circle ${pos === 4 ? 'target' : ''} ${pos === 1 ? 'active' : ''}`;
                circle.innerText = pos;
                circle.id = `circle-${i}-${pos}`;
                circle.onclick = () => setDiskPosition(i, pos);
                circleContainer.appendChild(circle);
            }
            row.appendChild(circleContainer);

            const depControls = document.createElement('div');
            depControls.className = 'dep-controls';
            depControls.id = `dep-controls-${i}`;
            
            [-1, 0, 1].forEach(val => {
                const btn = document.createElement('button');
                btn.className = `dep-btn ${val === 0 ? 'selected' : ''}`;
                btn.innerText = val > 0 ? `+${val}` : val;
                btn.id = `dep-btn-${i}-${val}`;
                btn.onclick = () => setDependencyValue(i, val);
                depControls.appendChild(btn);
            });
            row.appendChild(depControls);

            const editBtn = document.createElement('button');
            editBtn.className = 'edit-btn';
            editBtn.innerText = translations[currentLang].editBtnDefault;
            editBtn.id = `edit-btn-${i}`;
            editBtn.onclick = () => toggleEditMode(i);
            row.appendChild(editBtn);

            container.appendChild(row);
        }

        document.getElementById('output').innerText = translations[currentLang].defaultOutput;
    }

    function setDiskPosition(diskIdx, position) {
        // If we are in edit mode, we don't want to accidentally change positions
        if (currentMasterIdx !== null) return;

        disks[diskIdx] = position;
        // UI update of circles
        for (let pos = 1; pos <= 7; pos++) {
            const circle = document.getElementById(`circle-${diskIdx}-${pos}`);
            if (pos === position) {
                circle.classList.add('active');
            } else {
                circle.classList.remove('active');
            }
        }
    }

    function toggleEditMode(masterIdx) {
        const count = disks.length;
        if (currentMasterIdx === masterIdx) {
            currentMasterIdx = null;
        } else {
            currentMasterIdx = masterIdx;
        }

        for (let i = 0; i < count; i++) {
            const row = document.getElementById(`disk-row-${i}`);
            const editBtn = document.getElementById(`edit-btn-${i}`);
            const depControls = document.getElementById(`dep-controls-${i}`);

            row.classList.remove('edit-master', 'edit-slave');
            editBtn.classList.remove('active');
            editBtn.innerText = translations[currentLang].editBtnDefault;
            depControls.style.display = 'none';

            if (currentMasterIdx !== null) {
                if (i === currentMasterIdx) {
                    row.classList.add('edit-master');
                    editBtn.classList.add('active');
                    editBtn.innerText = translations[currentLang].editBtnActive;
                } else {
                    row.classList.add('edit-slave');
                    depControls.style.display = 'flex';
                    updateDepButtonUI(i, dependencies[currentMasterIdx][i]);
                }
            }
        }
    }

    function setDependencyValue(slaveIdx, value) {
        if (currentMasterIdx === null) return;
        
        dependencies[currentMasterIdx][slaveIdx] = value;
        updateDepButtonUI(slaveIdx, value);
    }

    function updateDepButtonUI(slaveIdx, activeValue) {
        [-1, 0, 1].forEach(val => {
            const btn = document.getElementById(`dep-btn-${slaveIdx}-${val}`);
            if (val === activeValue) {
                btn.classList.add('selected');
            } else {
                btn.classList.remove('selected');
            }
        });
    }

    // --- LOGIC SOLVER (BFS IN JAVASCRIPT) ---
    function getNextState(currentState, diskIdx, direction) {
        let nextState = [...currentState];
        
        // Move main disk
        let newVal = nextState[diskIdx] + direction;
        if (newVal < 1 || newVal > 7) return null;
        nextState[diskIdx] = newVal;

        // Move slaves
        const masterDeps = dependencies[diskIdx] || {};
        for (let otherIdx = 0; otherIdx < nextState.length; otherIdx++) {
            if (otherIdx === diskIdx) continue;
            const factor = masterDeps[otherIdx] || 0;
            if (factor === 0) continue;

            let depDirection = direction * factor;
            let depNewVal = nextState[otherIdx] + depDirection;
            
            if (depNewVal < 1 || depNewVal > 7) return null; // Blockiert
            nextState[otherIdx] = depNewVal;
        }

        return nextState;
    }

    function calculateRoute() {
        const t = translations[currentLang];
        if (currentMasterIdx !== null) {
            alert(t.alertEditMode);
            return;
        }

        const count = disks.length;
        const targetStr = Array(count).fill(4).join(',');
        const startState = [...disks];

        if (startState.join(',') === targetStr) {
            document.getElementById('output').innerText = t.alreadyOpen;
            return;
        }

        // BFS Setup
        let queue = [ { state: startState, path: [] } ];
        let visited = new Set();
        visited.add(startState.join(','));

        let found = false;
        let solution = null;

        while (queue.length > 0) {
            let current = queue.shift();

            // Try each combination
            for (let i = 0; i < count; i++) {
                for (let dir of [ {val: -1, name: 'RIGHT'}, {val: 1, name: 'LEFT'} ]) {
                    let nextSt = getNextState(current.state, i, dir.val);

                    if (nextSt !== null) {
                        let key = nextSt.join(',');
                        if (!visited.has(key)) {
                            let newPath = [...current.path, { disk: i + 1, dir: dir.name }];

                            if (key === targetStr) {
                                solution = newPath;
                                found = true;
                                break;
                            }

                            visited.add(key);
                            queue.push({ state: nextSt, path: newPath });
                        }
                    }
                }
                if (found) break;
            }
            if (found) break;
        }

        // Display output
        const outputDiv = document.getElementById('output');
        if (solution) 
        {
            let cleanText = t.successTitle;
            for(let idx = 0; idx < solution.length; idx++) 
            {
                const dirWord = solution[idx].dir === 'LEFT' ? t.left : t.right;
                cleanText += `${t.stepText}${idx + 1}: ${t.moveText} ${solution[idx].disk} ${t.toText} ${dirWord}\n`;
            }
            outputDiv.innerText = cleanText;
        } else {
            outputDiv.innerText = t.noSolution;
        }
    }

    // Execute on start
    changeLanguage('en'); // Initialize all static texts in English
    initLock();
</script>
</body>
