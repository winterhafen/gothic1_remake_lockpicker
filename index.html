<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic 1 Remake - Lock Solver</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>

<div class="lang-switch">
    <button id="lang-btn-de" class="lang-btn active">DE</button>
    <button id="lang-btn-en" class="lang-btn">EN</button>
</div>


<div class="container">
    <h1 id="pageTitle">Gothic 1 Remake - Schloss-Knacker</h1>
    
    <div class="setup-row">
        <label id="diskCountLabel" for="diskCount">Anzahl Scheiben:</label>
        <input type="number" id="diskCount" value="4" min="1" max="10">
        <button id="generateBtn">Schloss generieren</button>
    </div>

    <div id="modeHint"></div>

    <div id="lockContainer"></div>

    <div style="margin-top: 25px;">
        <button id="solveBtn" style="font-size: 18px; width: 100%; padding: 12px;">Lösung berechnen</button>
    </div>

    <h3 id="solutionTitle">Lösungsweg:</h3>
    <div id="output">Klicke auf "Lösung berechnen", um die Kombination zu sehen...</div>
</div>

<script src="src/translations.js"></script>
<script src="src/solver.js"></script>
<script src="src/state.js"></script>
<script src="src/dom.js"></script>
<script src="src/app.js"></script>
</body>
