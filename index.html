<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic 1 Remake - Lock Picker</title>
    <link rel="icon" type="image/svg+xml" href="favicon-1024x1024.svg">
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>

<div class="lang-switch">
    <button id="lang-btn-de" class="lang-btn active">DE</button>
    <button id="lang-btn-en" class="lang-btn">EN</button>
</div>


<div class="container">
    <h1 id="pageTitle"></h1>
    
    <div class="setup-row">
        <label id="diskCountLabel" for="diskCount"></label>
        <input type="number" id="diskCount" value="4" min="1" max="10">
        <button id="generateBtn"></button>
    </div>

    <div id="configStatusHint" class="config-status-hint" aria-live="polite"></div>

    <div id="modeHint"></div>

    <div id="lockContainer"></div>

    <div class="dependency-status-panel">
        <h3 id="dependencyStatusTitle"></h3>
        <div id="dependencyStatus"></div>
    </div>

    <div style="margin-top: 25px;">
        <button id="solveBtn" style="font-size: 18px; width: 100%; padding: 12px;"></button>
    </div>

    <div class="play-row">
        <button id="prevStepBtn" class="play-btn step-btn" style="display: none;"></button>
        <button id="playBtn" class="play-btn auto-play-btn" style="display: none;"></button>
        <button id="nextStepBtn" class="play-btn step-btn" style="display: none;"></button>
    </div>

    <h3 id="solutionTitle"></h3>
    <div id="output"></div>
</div>


<script src="src/translations.js"></script>
<script src="src/solver.js"></script>
<script src="src/state.js"></script>
<script src="src/dom.js"></script>
<script src="src/app.js"></script>
</body>
